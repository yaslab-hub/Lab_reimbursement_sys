<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實驗室購物核銷系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>實驗室採購申請單</h2>
    <form id="purchaseForm">
        <div class="form-group">
            <label>採購人 (Purchaser)</label>
            <input type="text" id="purchaser" required>
        </div>
        <div class="form-group">
            <label>品項 (Item Name)</label>
            <input type="text" id="itemName" required>
        </div>
        <div class="form-group">
            <label>廠牌 (Brand)</label>
            <input type="text" id="brand">
        </div>
        <div class="form-group">
            <label>報價 NTD (Price)</label>
            <input type="number" id="price" required>
        </div>
        <div class="form-group">
            <label>訂購日期 (Order Date)</label>
            <input type="date" id="orderDate" required>
        </div>
        <div class="form-group">
            <label>發票或貨物照片上傳</label>
            <input type="file" id="fileUpload" accept="image/*,.pdf" required>
        </div>
        
        <button type="button" onclick="submitForm()">送出申請</button>
        <div id="status"></div>
    </form>
</div>

<script>
    // ！！！把這裡換成你剛剛複製的 GAS Web App URL ！！！
    const GAS_URL = "https://script.google.com/macros/s/你的_GAS_網址/exec";

    function submitForm() {
        document.getElementById('status').innerText = "上傳中，請稍候...";
        document.querySelector('button').disabled = true;

        const fileInput = document.getElementById('fileUpload');
        const file = fileInput.files[0];

        // 將檔案轉換為 Base64 格式，這樣才能透過 JSON 傳給 GAS
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result.split(',')[1];
            
            const payload = {
                purchaser: document.getElementById('purchaser').value,
                itemName: document.getElementById('itemName').value,
                brand: document.getElementById('brand').value,
                price: document.getElementById('price').value,
                orderDate: document.getElementById('orderDate').value,
                purchaseId: "EX-" + Math.floor(Math.random() * 10000), // 簡單產生隨機ID，後續可優化
                priceCategory: document.getElementById('price').value > 10000 ? ">10,000 NTD 需詢價" : "<10,000 NTD 低價",
                fileName: file.name,
                fileType: file.type,
                fileBase64: base64Data,
                note: ""
            };

            // 使用 fetch 傳送資料到 Google 後端
            fetch(GAS_URL, {
                method: 'POST',
                // 使用 text/plain 可避免跨網域 (CORS) 的預檢請求問題
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('status').innerText = "送出成功！";
                    document.getElementById('status').style.color = "green";
                    document.getElementById('purchaseForm').reset();
                } else {
                    document.getElementById('status').innerText = "發生錯誤：" + data.message;
                    document.getElementById('status').style.color = "red";
                }
                document.querySelector('button').disabled = false;
            })
            .catch(error => {
                document.getElementById('status').innerText = "傳輸失敗：" + error;
                document.querySelector('button').disabled = false;
            });
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
